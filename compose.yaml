name: monitoring-maxval

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - backup_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    command: ["caddy", "run", "--watch", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy
      - ./tls:/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  tls-manager:
    build:
      context: .
      dockerfile: tls-manager/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONITORING_APP_UPSTREAM: app:8000
      CADDY_ADMIN_URL: http://caddy:2019/load
    volumes:
      - ./caddy:/etc/caddy
      - ./tls:/tls
    depends_on:
      caddy:
        condition: service_started

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backup_data:
    name: ${BACKUP_VOLUME_NAME:-monitoring-maxval_backup_data}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-monitoring-maxval_postgres_data}
  caddy_data:
  caddy_config:
