{% extends "base.html" %}
{% block title %}Вход · Мониторинг Maxval{% endblock %}
{% block content %}
<section class="login-shell">
  <div class="panel login-panel">
    <div class="login-heading">
      <div><p class="eyebrow">Закрытый доступ</p><h1>Вход</h1></div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Переключить тему" title="Переключить тему">
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.25"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
        <span class="theme-toggle-thumb" aria-hidden="true"></span>
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></svg>
      </button>
    </div>
    <p class="muted">Используйте локальную учётную запись Мониторинга Maxval.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Логин<input name="username" autocomplete="username" required autofocus maxlength="64"></label>
      <label>Пароль<input type="password" name="password" autocomplete="current-password" required maxlength="64"></label>
      <button class="button button-primary" type="submit">Войти</button>
    </form>
  </div>
</section>
{% endblock %}
